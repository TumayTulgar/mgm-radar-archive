name: MGM Radar PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: radar-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and Istanbul PPI dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python files
        run: |
          python -m py_compile fetch_radar.py tests/test_fetch_radar.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run live Istanbul PPI dry-run (no R2 access)
        run: >-
          python fetch_radar.py
          --station 34
          --product PPI
          --dry-run
          --output-dir output/ci-dry-run

      - name: Upload dry-run NetCDF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mgm-istanbul-ppi-pr-dry-run
          path: output/ci-dry-run/**/*.nc
          if-no-files-found: warn
          retention-days: 2
